title: Team Context Template
description: User guide for the Team Context Template repository.

# Leave url/baseurl blank for local preview (jekyll serve). Do NOT use angle
# brackets — they are invalid URI characters and break the build. When you
# publish to a GitHub project site, set them like:
#   url: https://your-org.github.io
#   baseurl: /your-repository
url: ""
baseurl: ""

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

aux_links:
  GitHub Repository:
    - https://github.com/your-org/your-repository

search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 5
  preview_words_after: 10

heading_anchors: true
color_scheme: light
